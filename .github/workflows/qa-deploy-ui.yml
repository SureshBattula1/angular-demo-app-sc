name: Deploy Angular UI to AWS EC2

on:
  push:
    branches:
      - qa-ui-v1.5.0 # Triggers automatically when code is pushed or merged into qa-ui-v1.5.0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 2. Install dependencies & Build static bundle
      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build -- --configuration=production

      # 3. Sync compiled production dist files to EC2 server via rsync
      - name: Deploy Built Artifacts to EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.QA_SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          ssh-keyscan -H ${{ secrets.QA_SERVER_HOST }} >> ~/.ssh/known_hosts
          
          # Sync output build files to /var/www/qa/ui/dist
          rsync -avz --delete \
            ./dist/ \
            ${{ secrets.QA_SERVER_USER }}@${{ secrets.QA_SERVER_HOST }}:/var/www/qa/ui/dist/

      # 4. Set directory permissions and reload Nginx
      - name: Reload Nginx on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_SERVER_HOST }}
          username: ${{ secrets.QA_SERVER_USER }}
          key: ${{ secrets.QA_SERVER_SSH_KEY }}
          script: |
            sudo chown -R ubuntu:www-data /var/www/qa/ui
            sudo chmod -R 755 /var/www/qa/ui
            sudo systemctl reload nginx
