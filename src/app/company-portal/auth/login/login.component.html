<div class="login-container">
  <div class="login-card">
    <!-- Logo and Header -->
    <div class="login-header">
      <div class="logo-container">
        <img src="assets/images/bigBridz-logo.jpg" alt="BigBridz Logo" class="logo-img">
      </div>
     <!-- <h1 class="login-title"></h1> -->
      <p class="login-subtitle">Company Portal Login - Sign In </p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email Field -->
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Email Address</mat-label>
        <input 
          matInput 
          type="email" 
          formControlName="email" 
          placeholder="Enter your email"
          autocomplete="email"
        >
        <mat-icon matPrefix>email</mat-icon>
        <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
          Email is required
        </mat-error>
        <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
          Please enter a valid email
        </mat-error>
      </mat-form-field>

      <!-- Password Field -->
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Password</mat-label>
        <input 
          matInput 
          [type]="hidePassword ? 'password' : 'text'" 
          formControlName="password" 
          placeholder="Enter your password"
          autocomplete="current-password"
        >
        <mat-icon matPrefix>lock</mat-icon>
        <button 
          mat-icon-button 
          matSuffix 
          type="button"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hidePassword"
        >
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
          Password is required
        </mat-error>
        <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
          Password must be at least 8 characters
        </mat-error>
      </mat-form-field>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <!-- Submit Button -->
      <button 
        mat-raised-button 
        color="primary" 
        type="submit" 
        class="login-btn w-100"
        [disabled]="isLoading || loginForm.invalid"
      >
        <mat-spinner *ngIf="isLoading" diameter="20" class="spinner-inline"></mat-spinner>
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading">Signing In...</span>
      </button>
   
    </form>

    <!-- Footer -->
    <div class="login-footer">
      <p>Copyright &copy; {{ currentYear }} BigBridz Pvt Ltd. All rights reserved.</p>
    </div>
  </div>

  <!-- Background Design -->
  <div class="login-background">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
  </div>
</div>
