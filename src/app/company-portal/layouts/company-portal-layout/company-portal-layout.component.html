<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="side" opened="true" class="sidenav">
    <div class="sidenav-header">
      <h2>Company Portal</h2>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/company-portal/dashboard" routerLinkActive="active">
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/company-portal/schools" routerLinkActive="active">
        <mat-icon>school</mat-icon>
        <span>Schools</span>
      </a>
      <a mat-list-item routerLink="/company-portal/companies" routerLinkActive="active">
        <mat-icon>business</mat-icon>
        <span>Companies</span>
      </a>
      <a mat-list-item routerLink="/company-portal/impersonation" routerLinkActive="active">
        <mat-icon>person_search</mat-icon>
        <span>Virtual Onboarding</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="toggleSidenav()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="spacer"></span>
      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="user-info">
          <p class="user-name">{{ getUserName() }}</p>
          <p class="user-email">{{ currentUser()?.email }}</p>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
