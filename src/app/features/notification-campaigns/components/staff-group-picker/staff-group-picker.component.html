<mat-card class="staff-group-card">
  <mat-card-header>
    <mat-card-title>{{ label }}</mat-card-title>
    <span class="count-badge">{{ selectedIds.length }} / {{ people.length }}</span>
  </mat-card-header>
  <mat-card-content>
    <mat-form-field appearance="outline" class="search-field compact-field" subscriptSizing="dynamic">
      <mat-label>Search</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput [(ngModel)]="search" placeholder="Name or role…" />
    </mat-form-field>

    <div class="select-all-row" *ngIf="filteredPeople.length">
      <mat-checkbox
        [checked]="allFilteredSelected"
        [indeterminate]="someFilteredSelected"
        (change)="toggleSelectAllFiltered($event.checked)">
        Select all shown
      </mat-checkbox>
    </div>

    <p class="empty" *ngIf="people.length === 0">No people in this group.</p>
    <p class="empty" *ngIf="people.length && !filteredPeople.length">No matches for your search.</p>

    <ul class="people-list" *ngIf="filteredPeople.length">
      <li *ngFor="let person of filteredPeople">
        <mat-checkbox
          [checked]="isSelected(person.user_id)"
          (change)="togglePerson(person.user_id, $event.checked)">
          <span class="person-name">{{ person.name }}</span>
          <span class="person-sub">{{ person.subtitle }}</span>
        </mat-checkbox>
      </li>
    </ul>
  </mat-card-content>
</mat-card>
