<div class="holiday-page-container">

  <!-- Single Calendar Card with Integrated Header -->
  <mat-card class="calendar-card">
    
    <!-- Integrated Header: Title (Left) | Month Nav (Middle) | Actions (Right) -->
    <div class="calendar-header">
      <!-- Left: Title and Subtitle -->
      <div class="header-left">
        <h1>
          <mat-icon>event_note</mat-icon>
          Holiday Calendar
        </h1>
        <p class="subtitle">View and manage school holidays</p>
      </div>

      <!-- Middle: Month Navigation -->
      <div class="month-navigation">
        <button mat-icon-button (click)="previousMonth()" [disabled]="loading" matTooltip="Previous Month">
          <mat-icon>chevron_left</mat-icon>
        </button>
        
        <h2 class="current-month">
          {{ monthNames[currentMonth] }} {{ currentYear }}
        </h2>
        
        <button mat-icon-button (click)="nextMonth()" [disabled]="loading" matTooltip="Next Month">
          <mat-icon>chevron_right</mat-icon>
        </button>
      </div>

      <!-- Right: Action Buttons -->
      <div class="header-right">
        <button mat-stroked-button (click)="goToToday()" class="today-btn">
          <mat-icon>today</mat-icon>
          Today
        </button>
        
      </div>
    </div>

    <!-- Legend -->
    <div class="calendar-legend">
      <div class="legend-item" *ngFor="let type of holidayTypes">
        <span class="legend-dot" [style.background-color]="type.color"></span>
        <mat-icon class="legend-icon">{{ type.icon }}</mat-icon>
        <span>{{ type.label }}</span>
      </div>
    </div>

    <!-- Calendar Grid -->
    <div class="calendar-body" *ngIf="!loading">
      <!-- Weekday Headers -->
      <div class="weekdays">
        <div class="weekday" *ngFor="let day of weekDays">{{ day }}</div>
      </div>

      <!-- Days Grid -->
      <div class="days-grid">
        <div
          *ngFor="let day of calendarDays"
          class="day-cell"
          [class.other-month]="!day.isCurrentMonth"
          [class.today]="day.isToday"
          [class.weekend]="day.isWeekend"
          [class.has-holiday]="day.holidays.length > 0"
          (click)="onDayClick(day)">
          
          <div class="day-number">{{ day.number }}</div>

          <!-- Holiday Badges -->
          <div class="holiday-badges" *ngIf="day.holidays.length > 0">
            <div
              *ngFor="let holiday of day.holidays"
              class="holiday-badge"
              [style.background-color]="holiday.color || getTypeColor(holiday.type)"
              [matTooltip]="holiday.title"
              (click)="viewHoliday(holiday, $event)">
              <mat-icon class="badge-icon">{{ getTypeIcon(holiday.type) }}</mat-icon>
              <span class="badge-text">{{ holiday.title }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="loading-state">
      <mat-spinner diameter="50"></mat-spinner>
      <p>Loading calendar...</p>
    </div>
  </mat-card>

  <!-- Holidays List (DataTable Below Calendar) -->
  <div class="holidays-list-section">
    <app-data-table
      #dataTable
      [data]="allHolidays"
      [config]="tableConfig"
      [title]="'All Holidays'"
      [loading]="loadingList"
      (actionClicked)="onAction($event)"
      (exportClicked)="onExport($event)">
    </app-data-table>
  </div>

</div>
