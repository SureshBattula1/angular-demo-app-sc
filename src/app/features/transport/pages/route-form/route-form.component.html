<div class="tform-page">
  <div class="form-card">
    <div class="form-header"><h1>{{ isEdit ? 'Edit Route' : 'Add Route' }}</h1></div>
    <form [formGroup]="form" (ngSubmit)="submit()" class="form-body">
      <div class="grid">
        <mat-form-field appearance="outline">
          <mat-label>Branch</mat-label>
          <mat-select formControlName="branch_id">
            <mat-option *ngFor="let b of branches" [value]="b.id">{{ b.name }}</mat-option>
          </mat-select>
          <mat-error>Branch is required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Route Number</mat-label>
          <input matInput formControlName="route_number" maxlength="50">
          <mat-error>Route number is required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Route Name</mat-label>
          <input matInput formControlName="route_name" maxlength="255">
          <mat-error>Route name is required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Fare (₹)</mat-label>
          <input matInput type="number" min="0" formControlName="fare">
          <mat-error>Fare is required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Distance (km)</mat-label>
          <input matInput type="number" min="0" formControlName="distance">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Estimated Time (min)</mat-label>
          <input matInput type="number" min="0" formControlName="estimated_time">
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Description</mat-label>
        <textarea matInput rows="2" formControlName="description"></textarea>
      </mat-form-field>

      <!-- Stops editor -->
      <div class="stops-section" formArrayName="stops">
        <div class="stops-head">
          <h3>Stops</h3>
          <button mat-stroked-button color="primary" type="button" (click)="addStop()">
            <mat-icon>add</mat-icon> Add Stop
          </button>
        </div>
        <div class="stop-row" *ngFor="let s of stops.controls; let i = index" [formGroupName]="i">
          <span class="seq">{{ i + 1 }}</span>
          <mat-form-field appearance="outline" class="stop-name">
            <mat-label>Stop name</mat-label>
            <input matInput formControlName="stop_name">
          </mat-form-field>
          <mat-form-field appearance="outline" class="stop-time">
            <mat-label>Pickup</mat-label>
            <input matInput type="time" formControlName="pickup_time">
          </mat-form-field>
          <mat-form-field appearance="outline" class="stop-time">
            <mat-label>Drop</mat-label>
            <input matInput type="time" formControlName="drop_time">
          </mat-form-field>
          <button mat-icon-button color="warn" type="button" (click)="removeStop(i)" matTooltip="Remove stop">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
        <p class="no-stops" *ngIf="!stops.length">No stops added yet.</p>
      </div>

      <mat-checkbox formControlName="is_active">Active</mat-checkbox>
      <div class="actions">
        <button mat-button type="button" (click)="cancel()" [disabled]="saving">Cancel</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="saving">{{ isEdit ? 'Update' : 'Create' }} Route</button>
      </div>
    </form>
  </div>
</div>
