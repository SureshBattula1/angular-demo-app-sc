<div class="tform-page">
  <div class="form-card">
    <div class="form-header"><h1>{{ isEdit ? 'Edit Driver' : 'Add Driver' }}</h1></div>
    <form [formGroup]="form" (ngSubmit)="submit()" class="form-body">
      <div class="grid">
        <mat-form-field appearance="outline">
          <mat-label>Branch</mat-label>
          <mat-select formControlName="branch_id">
            <mat-option *ngFor="let b of branches" [value]="b.id">{{ b.name }}</mat-option>
          </mat-select>
          <mat-error>Branch is required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" maxlength="255">
          <mat-error>Name is required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Phone</mat-label>
          <input matInput formControlName="phone" maxlength="20">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>License Number</mat-label>
          <input matInput formControlName="license_number" maxlength="60">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>License Expiry</mat-label>
          <input matInput [matDatepicker]="lp" formControlName="license_expiry" readonly>
          <mat-datepicker-toggle matSuffix [for]="lp"></mat-datepicker-toggle>
          <mat-datepicker #lp></mat-datepicker>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Address</mat-label>
          <input matInput formControlName="address">
        </mat-form-field>
      </div>
      <mat-checkbox formControlName="is_active">Active</mat-checkbox>
      <div class="actions">
        <button mat-button type="button" (click)="cancel()" [disabled]="saving">Cancel</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="saving">{{ isEdit ? 'Update' : 'Create' }} Driver</button>
      </div>
    </form>
  </div>
</div>
