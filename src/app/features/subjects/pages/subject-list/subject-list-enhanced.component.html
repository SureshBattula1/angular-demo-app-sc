<div class="page-container">
  <!-- Toolbar Navigation -->
  <mat-card class="view-header-card">
    <mat-toolbar class="subject-toolbar">
      <button 
        mat-button 
        class="toolbar-menu-item" 
        [class.active]="activeTab === 'subjects'"
        (click)="switchTab('subjects')">
        <mat-icon>menu_book</mat-icon>
        <span>All Subjects</span>
        <span class="tab-badge" *ngIf="subjectCount > 0">{{ subjectCount }}</span>
      </button>
      
      <button 
        mat-button 
        class="toolbar-menu-item" 
        [class.active]="activeTab === 'assignments'"
        (click)="switchTab('assignments')">
        <mat-icon>assignment_turned_in</mat-icon>
        <span>Assigned Subjects</span>
        <span class="tab-badge" *ngIf="assignmentCount > 0">{{ assignmentCount }}</span>
      </button>
    </mat-toolbar>
  </mat-card>

  <!-- Tab Content with Lazy Loading -->
  <!-- Subjects Tab - Lazy Loaded -->
  <app-subject-list *ngIf="activeTab === 'subjects' && isTabLoaded('subjects')"></app-subject-list>

  <!-- Assignments Tab - Lazy Loaded -->
  <app-assigned-subjects-list *ngIf="activeTab === 'assignments' && isTabLoaded('assignments')"></app-assigned-subjects-list>
</div>
