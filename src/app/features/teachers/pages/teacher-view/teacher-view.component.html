<div class="loading-container" *ngIf="isLoading">
  <mat-spinner diameter="60"></mat-spinner>
  <p>Loading teacher information...</p>
</div>

<div class="view-container" *ngIf="!isLoading && teacher">
  <!-- Action Bar -->
  <div class="view-action-bar">
    <button mat-button (click)="onBack()">
      <mat-icon>arrow_back</mat-icon>
      Back to List
    </button>
    <div class="action-buttons">
      <button 
        *ngIf="hasEditPermission"
        mat-raised-button 
        color="primary" 
        (click)="onEdit()">
        <mat-icon>edit</mat-icon>
        Edit
      </button>
      <button 
        *ngIf="hasDeletePermission"
        mat-raised-button 
        color="warn" 
        (click)="onDelete()">
        <mat-icon>delete</mat-icon>
        Delete
      </button>
    </div>
  </div>

  <!-- Header Component with Toolbar Navigation -->
  <app-teacher-header
    [teacher]="teacher"
    [showProfilePicture]="showProfilePicture"
    [profilePictureUrl]="profilePictureUrl"
    [activeMenu]="activeMenu"
    (menuClick)="onMenuClick($event)"
    (imageLoad)="onImageLoad()"
    (imageError)="onImageError()">
  </app-teacher-header>
    
  <!-- Content Sections - Lazy Loaded -->
  <mat-card class="content-card">
    <!-- Teacher Info Section -->
    <app-teacher-info 
      *ngIf="activeMenu === 'info'" 
      [teacher]="teacher">
    </app-teacher-info>

    <!-- Attendance Analytics Section -->
    <app-teacher-attendance 
      *ngIf="activeMenu === 'attendance'" 
      [teacher]="teacher">
    </app-teacher-attendance>

    <!-- Leaves Section -->
    <app-teacher-leaves 
      *ngIf="activeMenu === 'leaves'" 
      [teacher]="teacher">
    </app-teacher-leaves>

  </mat-card>
</div>
