<div class="book-form-page">
  <div class="form-card">
    <div class="form-header">
      <h1>{{ isEdit ? 'Edit Book' : 'Add Book' }}</h1>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form-body">
      <div class="grid">
        <mat-form-field appearance="outline">
          <mat-label>Branch</mat-label>
          <mat-select formControlName="branch_id">
            <mat-option *ngFor="let b of branches" [value]="b.id">{{ b.name }}</mat-option>
          </mat-select>
          <mat-error>Branch is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Title</mat-label>
          <input matInput formControlName="title" maxlength="255">
          <mat-error>Title is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Author</mat-label>
          <input matInput formControlName="author" maxlength="255">
          <mat-error>Author is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Category</mat-label>
          <input matInput formControlName="category" maxlength="100" placeholder="e.g. Programming">
          <mat-error>Category is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>ISBN</mat-label>
          <input matInput formControlName="isbn" maxlength="50">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Language</mat-label>
          <input matInput formControlName="language" maxlength="50">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Publisher</mat-label>
          <input matInput formControlName="publisher">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Published Year</mat-label>
          <input matInput [matDatepicker]="yearPicker" formControlName="published_year_date" readonly placeholder="Select year">
          <mat-datepicker-toggle matSuffix [for]="yearPicker"></mat-datepicker-toggle>
          <mat-datepicker #yearPicker startView="multi-year" (yearSelected)="onYearSelected($event, yearPicker)"></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Edition</mat-label>
          <input matInput formControlName="edition">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Pages</mat-label>
          <input matInput type="number" formControlName="pages">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Total Copies</mat-label>
          <input matInput type="number" min="1" formControlName="total_copies">
          <mat-error>Must be at least 1</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Available Copies</mat-label>
          <input matInput type="number" min="0" formControlName="available_copies" placeholder="Defaults to total">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Location / Rack</mat-label>
          <input matInput formControlName="location">
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Description</mat-label>
        <textarea matInput rows="3" formControlName="description"></textarea>
      </mat-form-field>

      <mat-checkbox formControlName="is_active">Active</mat-checkbox>

      <div class="actions">
        <button mat-button type="button" (click)="cancel()" [disabled]="saving">Cancel</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="saving">
          {{ isEdit ? 'Update' : 'Create' }} Book
        </button>
      </div>
    </form>
  </div>
</div>
