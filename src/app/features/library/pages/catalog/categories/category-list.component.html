<div class="category-page-container">
  <app-data-table
    [data]="categories"
    [config]="tableConfig"
    [title]="'Book Categories'"
    [loading]="loading"
    (actionClicked)="onAction($event)"
    (paginationChanged)="onPaginationChange($event)"
    (searchChanged)="onSearch($event)">
  </app-data-table>

  <!-- Add/Edit Category Modal -->
  <div class="modal-backdrop" *ngIf="showModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="header-title-box">
          <mat-icon color="primary">{{ editItem ? 'edit' : 'add_circle' }}</mat-icon>
          <h3>{{ editItem ? 'Edit Category' : 'Add New Category' }}</h3>
        </div>
        <button mat-icon-button (click)="closeModal()" aria-label="Close dialog">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <div class="modal-body">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Category Name *</mat-label>
          <input matInput [(ngModel)]="formData.name" placeholder="e.g. Computer Science" required />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Category Code</mat-label>
          <input matInput [(ngModel)]="formData.code" placeholder="e.g. CS" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Description</mat-label>
          <textarea matInput [(ngModel)]="formData.description" placeholder="Optional notes" rows="3"></textarea>
        </mat-form-field>
      </div>

      <div class="modal-footer">
        <button mat-button (click)="closeModal()">Cancel</button>
        <button mat-flat-button color="primary" [disabled]="!formData.name" (click)="saveCategory()">
          <mat-icon>check</mat-icon> Save Category
        </button>
      </div>
    </div>
  </div>
</div>
