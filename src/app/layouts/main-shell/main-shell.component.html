<div class="app-container">
  <!-- Header Toolbar -->
  <mat-toolbar class="app-header" color="primary">
    <!-- Toggle Button - Hide for students -->
    <button mat-icon-button 
            *ngIf="!isStudentRole()"
            (click)="toggleSidebar()" 
            class="sidebar-toggle"
            aria-label="Toggle sidebar">
      <mat-icon>{{ isSidebarCollapsed ? 'menu' : 'menu_open' }}</mat-icon>
    </button>
    
    <span class="app-title">School Management System</span>
    <span class="spacer"></span>
    
    <!-- Header Actions -->
    <!-- Theme Selector -->
    <mat-form-field appearance="outline" class="theme-selector">
      <mat-label>Theme</mat-label>
      <mat-select [(value)]="selectedTheme" (selectionChange)="onThemeChange($event.value)">
        <mat-option *ngFor="let theme of themeOptions" [value]="theme.value">
          <mat-icon class="theme-color-icon" [style.--icon-color]="theme.color">palette</mat-icon> {{ theme.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    
    <button mat-icon-button aria-label="Notifications">
      <mat-icon matBadge="3" matBadgeColor="warn">notifications</mat-icon>
    </button>
    
    <button mat-button [matMenuTriggerFor]="userMenu" aria-label="User menu" class="user-avatar-btn">
      <div class="header-user-avatar">
        {{ getUserInitials() }}
      </div>
    </button>
  </mat-toolbar>

  <!-- Sidenav Container -->
  <mat-sidenav-container class="app-sidenav-container" [class.sidebar-collapsed]="isSidebarCollapsed || isStudentRole()">
    <!-- Sidenav - Hide for students -->
    <mat-sidenav
      #drawer
      *ngIf="!isStudentRole()"
      [mode]="isMobileOrTablet() ? 'over' : 'side'"
      [opened]="isMobileOrTablet() ? !isSidebarCollapsed : true"
      [class.collapsed]="isSidebarCollapsed && !isMobileOrTablet()"
      (closedStart)="onSidenavClosed()"
      class="app-sidenav">
      
      <mat-nav-list>
        <!-- Dynamic Menu Items -->
        <ng-container *ngFor="let item of menuItems">
          <a mat-list-item 
             *hasPermission="item.permission; hasPermissionMode: item.permissionMode || 'all'"
             [routerLink]="item.route"
             [class.active]="isRouteActive(item.route)"
             (click)="onMenuItemClick()"
             [matTooltip]="isSidebarCollapsed && !isMobileOrTablet() ? (item.tooltip || item.label) : null"
             [matTooltipPosition]="'right'"
             [matTooltipDisabled]="isMobileOrTablet()">
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle [class.hidden]="isSidebarCollapsed">{{ item.label }}</span>
          </a>
        </ng-container>
      </mat-nav-list>
    </mat-sidenav>

    <!-- Main Content -->
    <mat-sidenav-content class="app-content">
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>

<!-- User Menu -->
<mat-menu #userMenu="matMenu" class="user-menu">
  <!-- User Info Header -->
  <div  mat-menu-item disabled>
    <div class="user-menu-header">
      <div class="user-avatar">
        <div class="user-initials">{{ getUserInitials() }}</div>
      </div>
      <div class="user-details">
        <div class="user-name">{{ getUserDisplayName() }}</div>
        <div class="user-email">{{ getUserEmail() }}</div>
        <div class="user-role">
          <mat-icon class="role-icon">badge</mat-icon>
          {{ getUserRole() }}
        </div>
      </div>
    </div>
  </div>
  
  <mat-divider></mat-divider>
  
  <button mat-menu-item (click)="onProfile()">
    <mat-icon>person</mat-icon>
    <span>Profile</span>
  </button>
  <button mat-menu-item (click)="onSettings()">
    <mat-icon>settings</mat-icon>
    <span>Settings</span>
  </button>
  
  <mat-divider></mat-divider>
  
  <button mat-menu-item (click)="onLogout()" class="logout-menu-item">
    <mat-icon>logout</mat-icon>
    <span>Logout</span>
  </button>
</mat-menu>
